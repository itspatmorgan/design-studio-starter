name: Checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
permissions:
  contents: read
jobs:
  # Keep the tested OS stable when GitHub advances ubuntu-latest.
  scope:
    runs-on: ubuntu-24.04
    concurrency:
      group: scope-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: jdx/mise-action@v5
      - name: Check scope and asset sizes
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PUSH_ACTOR: ${{ github.actor }}
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_REF: ${{ github.event.pull_request.head.sha || github.sha }}
          STUDIO_SCOPE_ACTOR: ${{ github.event.pull_request.user.login || github.actor }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            BASE_REF=$(git merge-base "$BASE_REF" "$HEAD_REF")
            node scripts/check/check-scope.js --ci "$BASE_REF" "$HEAD_REF" --review
          else
            STUDIO_PLATFORM_ROLE=$(gh api "repos/$REPOSITORY/collaborators/$PUSH_ACTOR/permission" --jq '.role_name')
            export STUDIO_PLATFORM_ROLE
            node scripts/check/check-scope.js --ci "$BASE_REF" "$HEAD_REF"
          fi
          node scripts/check/check-asset-size.js --ci "$BASE_REF" "$HEAD_REF"
  regressions:
    runs-on: ubuntu-24.04
    concurrency:
      group: regressions-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: jdx/mise-action@v5
      - name: Locate dependency store
        id: store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.store.outputs.path }}
          key: pnpm-12-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'patches/**') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:release
  bundle:
    runs-on: ubuntu-24.04
    concurrency:
      group: bundle-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: jdx/mise-action@v5
      - name: Locate dependency store
        id: store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.store.outputs.path }}
          key: pnpm-12-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'patches/**') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm harness:check
      - name: Configure Pages
        if: github.repository == 'itspatmorgan/design-studio-starter' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: pages
        uses: actions/configure-pages@v6
      - run: pnpm build
        env:
          STUDIO_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - run: pnpm build:inspect
      - name: Upload Pages site
        if: github.repository == 'itspatmorgan/design-studio-starter' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  # Keep the existing required check name. A successful bundle alone cannot pass it.
  build:
    needs: [bundle, regressions]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require bundle and regression success
        env:
          BUNDLE_RESULT: ${{ needs.bundle.result }}
          REGRESSION_RESULT: ${{ needs.regressions.result }}
        run: test "$BUNDLE_RESULT" = success && test "$REGRESSION_RESULT" = success
  deploy:
    if: github.repository == 'itspatmorgan/design-studio-starter' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [scope, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check that this is still the current main commit
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          CURRENT_SHA=$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$CURRENT_SHA" = "$DEPLOY_SHA" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping superseded deployment $DEPLOY_SHA"
          fi
      - name: Deploy Pages site
        if: steps.current.outputs.publish == 'true'
        id: deployment
        uses: actions/deploy-pages@v5
