name: Scope check
on:
  push:
    branches: [main]
permissions:
  contents: read
  issues: write
jobs:
  scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v2
      - run: node scripts/check-scope.js --ci ${{ github.event.before }} ${{ github.event.after }}
      - if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Out-of-scope push by ${{ github.actor }}" \
            --body "Scope check failed for ${{ github.event.compare }} (run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
  # Fails on import-guard errors and broken meta.json files.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
