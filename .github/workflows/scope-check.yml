name: Checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
permissions:
  contents: read
jobs:
  scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: jdx/mise-action@v2
      - name: Check scope and asset sizes
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PUSH_ACTOR: ${{ github.actor }}
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_REF: ${{ github.event.pull_request.head.sha || github.sha }}
          STUDIO_SCOPE_ACTOR: ${{ github.event.pull_request.user.login || github.actor }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            BASE_REF=$(git merge-base "$BASE_REF" "$HEAD_REF")
            node scripts/check/check-scope.js --ci "$BASE_REF" "$HEAD_REF" --review
          else
            STUDIO_PLATFORM_ROLE=$(gh api "repos/$REPOSITORY/collaborators/$PUSH_ACTOR/permission" --jq '.role_name')
            export STUDIO_PLATFORM_ROLE
            node scripts/check/check-scope.js --ci "$BASE_REF" "$HEAD_REF"
          fi
          node scripts/check/check-asset-size.js --ci "$BASE_REF" "$HEAD_REF"
  build:
    needs: scope
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: jdx/mise-action@v2
      - run: pnpm install --frozen-lockfile
      - name: Configure Pages
        if: github.repository == 'itspatmorgan/design-studio-starter' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: pages
        uses: actions/configure-pages@v5
      - run: pnpm build
        env:
          STUDIO_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - name: Upload Pages site
        if: github.repository == 'itspatmorgan/design-studio-starter' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.repository == 'itspatmorgan/design-studio-starter' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages site
        id: deployment
        uses: actions/deploy-pages@v4
