name: Deploy
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/scope-check.yml
  publish:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist/
      # Add your host's deploy step here. This job runs only after all checks pass.
