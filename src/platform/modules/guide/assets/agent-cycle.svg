<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 190" role="img" aria-labelledby="title desc">
<title id="title">Direct, build, and review</title><desc id="desc">The human gives direction. The agent reads context, builds and checks. The human reviews the result and directs another iteration.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#596579"/></marker></defs>
<rect width="620" height="190" rx="12" fill="#f5f7fa"/>
<g font-family="Inter,Arial,sans-serif" fill="#172235" font-size="16"><rect x="24" y="24" width="174" height="74" rx="8" fill="white" stroke="#ccd3dd"/><text x="40" y="53" font-weight="600">You direct</text><text x="40" y="77" font-size="13" fill="#526074">Goal and context</text><path d="M202 61L219 61" fill="none" stroke="#596579" stroke-width="2" marker-end="url(#arrow)"/><rect x="228" y="24" width="174" height="74" rx="8" fill="white" stroke="#ccd3dd"/><text x="244" y="53" font-weight="600">Agent executes</text><text x="244" y="77" font-size="13" fill="#526074">Read, build, check</text><path d="M406 61L423 61" fill="none" stroke="#596579" stroke-width="2" marker-end="url(#arrow)"/><rect x="432" y="24" width="164" height="74" rx="8" fill="white" stroke="#ccd3dd"/><text x="448" y="53" font-weight="600">You review</text><text x="448" y="77" font-size="13" fill="#526074">Behavior and appearance</text><path d="M514 107V143H111V107" fill="none" stroke="#596579" stroke-width="2" marker-end="url(#arrow)"/><text x="310" y="171" text-anchor="middle" font-size="14">Use the result to direct the next change</text></g></svg>
