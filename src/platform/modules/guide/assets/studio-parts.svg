<g font-family="Inter,Arial,sans-serif" fill="#172235" font-size="16"><text x="24" y="30" font-weight="600">Shared studio foundations</text><rect x="24" y="46" width="278" height="70" rx="8" fill="white" stroke="#ccd3dd"/><text x="40" y="75" font-weight="600">Design systems</text><text x="40" y="99" font-size="13" fill="#526074">Components and design tokens</text><rect x="318" y="46" width="278" height="70" rx="8" fill="white" stroke="#ccd3dd"/><text x="334" y="75" font-weight="600">Handbook</text><text x="334" y="99" font-size="13" fill="#526074">Context, rules, and skills</text><path d="M310 126L310 160" fill="none" stroke="#596579" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="176" width="278" height="94" rx="8" fill="white" stroke="#ccd3dd"/><text x="40" y="205" font-weight="600">Your prototypes</text><text x="40" y="229" font-size="13" fill="#526074">Views + optional docs and canvases</text><rect x="318" y="176" width="278" height="94" rx="8" fill="white" stroke="#ccd3dd"/><text x="334" y="205" font-weight="600">Other contributors’ prototypes</text><text x="334" y="229" font-size="13" fill="#526074">Independent spaces to explore</text></g></svg>
