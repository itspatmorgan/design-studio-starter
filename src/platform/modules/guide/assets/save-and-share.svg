<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 122" role="img" aria-labelledby="title desc">
<title id="title">Share repository files</title><desc id="desc">Save and commit files locally. Push commits to the shared repository. Pull them into another local copy.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#596579"/></marker></defs>
<rect width="620" height="122" rx="12" fill="#f5f7fa"/>
<g font-family="Inter,Arial,sans-serif" fill="#172235" font-size="16"><rect x="24" y="24" width="174" height="74" rx="8" fill="white" stroke="#ccd3dd"/><text x="40" y="53" font-weight="600">Local files</text><text x="40" y="77" font-size="13" fill="#526074">Save, then commit</text><path d="M202 61L219 61" fill="none" stroke="#596579" stroke-width="2" marker-end="url(#arrow)"/><rect x="228" y="24" width="174" height="74" rx="8" fill="white" stroke="#ccd3dd"/><text x="244" y="53" font-weight="600">Repository</text><text x="244" y="77" font-size="13" fill="#526074">Push to share commits</text><path d="M406 61L423 61" fill="none" stroke="#596579" stroke-width="2" marker-end="url(#arrow)"/><rect x="432" y="24" width="164" height="74" rx="8" fill="white" stroke="#ccd3dd"/><text x="448" y="53" font-weight="600">Another copy</text><text x="448" y="77" font-size="13" fill="#526074">Pull to receive changes</text></g></svg>
